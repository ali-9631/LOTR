<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LOTR — Login</title>
  <link href="style.css" rel="stylesheet">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <h1>Welcome to Middle-earth</h1>
    <h2>Speak 'friend' and enter</h2>

    <form id="loginForm">
      <section>
        <label for="username">Username:</label><br>
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          required
        >
      </section>

      <section>
        <label for="password">Password:</label><br>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        >
      </section>
      <br/><br/>
      

      <button id="loginButton" type="submit">Login</button>

      <p id="loginMessage" role="status" aria-live="polite"></p>
    </form>

    <hr>

    <p>For testing, please use account:</p>
    <p>Username: <code>friend</code> / Password: <code>Mellon</code></p>
  </main>
</body>
</html>
