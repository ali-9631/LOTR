
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LOTR — Login</title>

  <link href="style.css" rel="stylesheet">

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >

  <script type="module" src="app.js"></script>
  <script type="module" src="explorer.js"></script>
</head>

<body>
  <main>
    <p id="date-time"></p>
    <h1>Welcome to Middle-earth</h1>
    <h2>Speak 'friend' and enter</h2>

    <form id="loginForm">
      <section>
        <label for="username">Username:</label><br>
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          required
        >
      </section>

      <section>
        <label for="password">Password:</label><br>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        >
      </section>

      <br>

      <button id="loginButton" type="submit">Login</button>
      <p id="loginMessage" role="status" aria-live="polite"></p>
    </form>

    <hr>

    <p>For testing, please use account:</p>
    <p>Username: <code>friend</code> / Password: <code>Mellon</code></p>

    <div id="appsContainer">

      <!-- Leap Year App -->
      <section id="leapYearApp">
        <hr>

        <h2>Leap Year?</h2>
        <p>Enter a year and discover whether it's a leap year.</p>

        <input
          id="yearInput"
          name="year"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="e.g. 2024"
          aria-describedby="yearMessage"
        >

        <p id="yearMessage" role="status" aria-live="polite"></p>
      </section>

      <!-- Currency Converter App -->
      <section id="currencyConverter">
        <hr>

        <h2>Currency Converter</h2>
        <p>Convert between euros and US dollars.</p>

        <section>
          <label for="conversionDirection">Conversion:</label><br>
          <select id="conversionDirection" name="conversionDirection">
            <option value="eur-usd">EUR → USD</option>
            <option value="usd-eur">USD → EUR</option>
          </select>
        </section>

        <section>
          <label for="currencyAmount">Amount:</label><br>
          <input
            id="currencyAmount"
            name="currencyAmount"
            type="text"
            inputmode="decimal"
            autocomplete="off"
            placeholder="e.g. 10.50"
            aria-describedby="currencyMessage"
          >
        </section>

        <button id="convertButton" type="button">Convert</button>

        <p id="currencyMessage" role="status" aria-live="polite"></p>
      </section>

      <!-- Weather -->
      <section id="weatherApp">
        <hr>

        <form id="weatherForm" class="search-row">
          <label for="weatherCity" class="visually-hidden">
            Search weather by city
          </label>

          <input
            id="weatherCity"
            type="text"
            placeholder="Search weather by city..."
            value="Amsterdam"
            autocomplete="off"
          >

          <button type="submit">Search</button>
        </form>

        <p id="weatherMessage" role="status" aria-live="polite"></p>

        <div id="weatherCard" class="weather-card" hidden>
          <p id="weatherPlace"></p>

          <div class="weather-main">
            <span id="weatherIcon" aria-hidden="true"></span>
            <strong id="weatherTemperature"></strong>
            <span id="weatherDescription"></span>
          </div>

          <div class="weather-details">
            <p>Feels like: <strong id="weatherFeelsLike"></strong></p>
            <p>Humidity: <strong id="weatherHumidity"></strong></p>
            <p>Wind: <strong id="weatherWind"></strong></p>
          </div>

          <div id="hourlyForecast" class="hourly-forecast"></div>
        </div>
      </section>

      <!-- Real-world map -->
      <section id="worldMapApp">
        <hr>

        <form id="mapSearchForm" class="search-row">
          <label for="mapCity" class="visually-hidden">
            Find a city on the map
          </label>

          <input
            id="mapCity"
            type="text"
            placeholder="Find a city on the world map..."
            autocomplete="off"
          >

          <button type="submit">Explore</button>
        </form>

        <p id="mapMessage" role="status" aria-live="polite"></p>

        <div
          id="worldMap"
          role="application"
          aria-label="Interactive world map"
        ></div>
      </section>

    </div>
  </main>
</body>
</html>
