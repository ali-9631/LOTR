
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LOTR — Precious Quiz</title>
  <link href="style.css" rel="stylesheet">
  <script type="module" src="site.js"></script>
</head>
<body>
  <nav>
    <a href="./index.html">Home</a>
    <button id="logoutButton" type="button">Logout</button>
  </nav>

  <main>
    <h1>The Precious Quiz</h1>

    <form id="quizForm">
      <section>
        <label for="q1">1. Who's your favorite Hobbit?</label><br>
        <input type="text" name="1" id="q1">
      </section>

      <section>
        <label for="q2">
          2. How many bites of lembas bread are enough to fill the stomach
          of a grown man?
        </label><br>
        <input type="number" name="2" id="q2">
      </section>

      <section>
        <label for="q3">3. Where do you land on this scale?</label><br>
        <span>Smeagol</span>
        <input
          type="range"
          name="3"
          id="q3"
          value="3"
          min="1"
          max="5"
        >
        <span>Gollum</span>
      </section>

      <section>
        <span>4. Who's NOT in the picture?</span><br>

        <input type="checkbox" name="4" id="faramir" value="faramir">
        <label for="faramir">Faramir</label>

        <input type="checkbox" name="4" id="legolas" value="legolas">
        <label for="legolas">Legolas</label>

        <input type="checkbox" name="4" id="aragorn" value="aragorn">
        <label for="aragorn">Aragorn</label>

        <div>
          <img
            src="https://upload.wikimedia.org/wikipedia/en/thumb/4/40/Fellowship.JPG/500px-Fellowship.JPG"
            alt="The Fellowship of the Ring"
            width="300"
          >
          <p class="caption">
            The Fellowship of the Ring, December 18, 3018 of the Third Age
            during the Council of Elrond in Rivendell.
          </p>
        </div>
      </section>

      <section>
        <label>5. Does one simply walk into Mordor?</label><br>

        <input type="radio" name="5" id="yes" value="yes">
        <label for="yes">Yes</label>

        <input type="radio" name="5" id="no" value="no">
        <label for="no">No</label>
      </section>

      <section>
        <label for="q6">6. Who would you save?</label><br>
        <select name="6" id="q6">
          <option value="">-</option>
          <option value="theoden">Théoden</option>
          <option value="saruman">Saruman</option>
          <option value="boromir">Boromir</option>
        </select>
      </section>

      <section>
        <label for="q7">7. Who would you NOT save?</label><br>
        <input list="q7options" id="q7" name="7">

        <datalist id="q7options">
          <option value="Pippin"></option>
        </datalist>
      </section>

      <section>
        <label for="extra">8. Anything else you want to add?</label><br>
        <textarea id="extra" name="extra" rows="3" cols="40"></textarea>
      </section>

      <hr>

      <section class="submission">
        <button type="submit">Submit answers</button>
        <p id="quizMessage" role="status" aria-live="polite"></p>
      </section>
    </form>
  </main>
</body>
</html>
